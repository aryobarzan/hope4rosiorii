name: CI

# Runs on every push to main or dev, and on every pull request. Vercel builds
# and deploys the site; this only checks the code, and costs nothing on a
# public repository.
on:
  push:
    branches: [main, dev]
  pull_request:

# The checks only read the code, so the token needs no write access
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # package.json "engines": ">=24"
          cache: pnpm

      # Fails if pnpm-lock.yaml and package.json disagree
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # next-env.d.ts and .next/types are git-ignored, so a clean checkout does
      # not have the route types (LayoutProps and so on) until they are
      # generated. Without this step tsc fails on a fresh clone.
      - run: pnpm exec next typegen

      - run: pnpm exec tsc --noEmit

      - run: pnpm test
